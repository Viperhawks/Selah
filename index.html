<head>

</head>
<body>
  <header>
    <select id="languageSelect">
  <option value="en">English</option>
  <option value="ml">Malayalam</option>
  <option value="ta">Tamil</option>
    </select>
    <h1 class="fade-in logo-title">
  <span class="cross">✝</span> SELAH
    </h1>
    <nav class="main-nav">
  <a href="index.html">Home</a>
  <a href="bible.html">Bible</a>
  <a href="stories.html">Stories</a>

    <p class="tagline">Pause • Pray • Reflect</p>
    <button id="themeToggle">🌙</button>
  </header>

  <main>
    <a href="bible.html" class="read-btn">Read the Bible</a>
    <a href="news.html" class="read-btn">Christian News</a>
    <section class="verse-box fade-in">
      <section class="verse">
  <h2>📖 Verse of the Day</h2>
  <div id="verseContainer">Loading verse...</div>
      </section>
      

    <section class="about">
      <p>
        Selah is a quiet place to pause, read Scripture, and reflect on God’s Word.
      </p>
    </section>
  </main>

  <footer>
    <p>© Selah • Word of God</p>
  </footer>
  <script>
async function loadVerse() {
  try {
    const res = await fetch("https://beta.ourmanna.com/api/v1/get/?format=json");

    const data = await res.json();

    if (!data || !data.verse || !data.verse.details) {
      throw new Error("Invalid data");
    }

    const verse = data.verse.details.text;
    const ref = data.verse.details.reference;

    document.getElementById("verseContainer").innerHTML = `
      <p>"${verse}"</p>
      <small>— ${ref}</small>
    `;

  } catch (error) {
    // 🔥 Fallback if API fails
    const fallback = [
      "Be still, and know that I am God. — Psalm 46:10",
      "The Lord is my shepherd; I shall not want. — Psalm 23:1",
      "I can do all things through Christ. — Philippians 4:13"
    ];

    const today = new Date().getDate();
    const verse = fallback[today % fallback.length];

    document.getElementById("verseContainer").innerHTML = verse;
  }
}

loadVerse();
  </script>

  
    
</body>
</html>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const toggle = document.getElementById("themeToggle");

  // Load saved theme
  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark");
  }

  toggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    // Save theme
    if (document.body.classList.contains("dark")) {
      localStorage.setItem("theme", "dark");
    } else {
      localStorage.setItem("theme", "light");
    }
  });

});
</script>
