<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selah — Pause & Reflect</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="fade-in logo-title">
  <span class="cross">✝</span> SELAH
    </h1>
    <nav class="main-nav">
  <a href="index.html">Home</a>
  <a href="bible.html">Bible</a>
  <a href="stories.html">Stories</a>
  <a href="news.html">News</a>
    </nav>
    <p class="tagline">Pause • Pray • Reflect</p>
    <button id="themeToggle">🌙</button>
  </header>

  <main>
    <a href="bible.html" class="read-btn">Read the Bible</a>
    <a href="news.html" class="read-btn">Christian News</a>
    <section class="verse-box fade-in">
      <h2>Verse of the Day</h2>
      <p id="verseText">Loading verse...</p>
      <span id="verseRef"></span>
      <section class="devotional">
  <div id="dailyDevotional" class="devotional-card"></div>
    </section>

    <section class="about">
      <p>
        Selah is a quiet place to pause, read Scripture, and reflect on God’s Word.
      </p>
    </section>
  </main>

  <footer>
    <p>© Selah • Word of God</p>
  </footer>

  <script src="script.js"></script>
  <script>
const devotionals = [
  {
    title: "Trust in Him",
    verse: "Proverbs 3:5",
    text: "Trust in the Lord with all your heart.",
    image: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
  },
  {
    title: "Be Still",
    verse: "Psalm 46:10",
    text: "Be still, and know that I am God.",
    image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
  },
  {
    title: "God is With You",
    verse: "Isaiah 41:10",
    text: "Do not fear, for I am with you.",
    image: "https://images.unsplash.com/photo-1496307042754-b4aa456c4a2d"
  },
  {
    title: "Walk in Light",
    verse: "John 8:12",
    text: "Whoever follows me will never walk in darkness.",
    image: "https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
  }
];

const today = new Date().getDate();
const index = today % devotionals.length;
const devo = devotionals[index];

document.getElementById("dailyDevotional").innerHTML = `
  <div class="devotional-bg" style="background-image: url('${devo.image}')">
    <div class="overlay">
      <h3>${devo.title}</h3>
      <p><em>${devo.verse}</em></p>
      <p>${devo.text}</p>
    </div>
  </div>
`;
  </script>
</body>
</html>
