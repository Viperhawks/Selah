<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selah — Pause & Reflect</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 class="fade-in logo-title">
  <span class="cross">✝</span> SELAH
    </h1>
    <nav class="main-nav">
  <a href="index.html">Home</a>
  <a href="bible.html">Bible</a>
  <a href="stories.html">Stories</a>
  <a href="news.html">News</a>
    </nav>
    <p class="tagline">Pause • Pray • Reflect</p>
    <button id="themeToggle">🌙</button>
  </header>

  <main>
    <a href="bible.html" class="read-btn">Read the Bible</a>
    <a href="news.html" class="read-btn">Christian News</a>
    <section class="verse-box fade-in">
      <section class="verse">
  <h2>📖 Verse of the Day</h2>
  <div id="verseContainer">Loading verse...</div>
      </section>
      

    <section class="about">
      <p>
        Selah is a quiet place to pause, read Scripture, and reflect on God’s Word.
      </p>
    </section>
  </main>

  <footer>
    <p>© Selah • Word of God</p>
  </footer>

  <script src="script.js"></script>
  <script><script>
fetch("https://beta.ourmanna.com/api/v1/get/?format=json")
  .then(res => res.json())
  .then(data => {
    const verse = data.verse.details.text;
    const ref = data.verse.details.reference;

    document.getElementById("verseContainer").innerHTML = `
      <p>"${verse}"</p>
      <small>— ${ref}</small>
    `;
  })
  .catch(() => {
    document.getElementById("verseContainer").innerHTML =
      "Unable to load verse.";
  });
  </script>
    
</body>
</html>
