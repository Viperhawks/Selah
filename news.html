<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selah — Christian News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SELAH</h1>
  <p class="tagline">Christian News</p>
  <a href="index.html" class="home-link">Home</a>
</header>

<main class="news-container">

  <h2>Latest News</h2>

  <div class="news-card" id="dailyNews"></div>
  <div id="newsContainer"></div>

<script>
const newsItems = [
  {
    title: "Global Prayer Movement",
    content: "Churches worldwide unite in prayer for revival."
  },
  {
    title: "Bible Distribution Expands",
    content: "Millions receive free Bibles in outreach programs."
  },
  {
    title: "Youth Faith Conference",
    content: "Young believers gather for worship and renewal."
  }
];

const newsIndex = new Date().getDate() % newsItems.length;

document.getElementById("dailyNews").innerHTML = `
  <h3>${newsItems[newsIndex].title}</h3>
  <p>${newsItems[newsIndex].content}</p>
`;
</script>

</main>

<footer>
  <p>© Selah • Word of God</p>
</footer>

</body>
</html>
