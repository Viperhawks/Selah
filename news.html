<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selah — Christian News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SELAH</h1>
  <p class="tagline">Christian News</p>
  <a href="index.html" class="home-link">Home</a>
</header>

<main class="news-container">

  <h2>Latest News</h2>

  <div class="news-card" id="dailyNews"></div>
  <div id="newsContainer"></div>

<script>
fetch("/api/news")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("newsContainer");

    if (!data || data.length === 0) {
      container.innerHTML = "<p>No news available.</p>";
      return;
    }

    container.innerHTML = "";

    data.forEach(article => {
      container.innerHTML += `
        <div class="news-card">
          <h3>${article.title || "No title"}</h3>
          <p>${article.description || "No description"}</p>
          <a href="${article.url}" target="_blank">Read more</a>
        </div>
      `;
    });
  })
  .catch(err => {
    document.getElementById("newsContainer").innerHTML =
      "Error loading news.";
    console.error(err);
  });
        </script>
