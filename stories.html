<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selah | Bible Stories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background-color: #f4f1ea;
      color: #3e2f1c;
      text-align: center;
    }

    header {
      background-color: #d6c7a1;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      text-decoration: none;
      margin: 0 10px;
      color: #3e2f1c;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .story {
      background: white;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: left;
    }

    .story h2 {
      margin-top: 0;
      color: #7b5e2e;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background-color: #d6c7a1;
    }
  </style>
</head>
<body>

<header>
  <h1>Selah</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
  </nav>
</header>

  <div class="container">
  <div id="storyContainer" class="story-card">Loading story...</div>
  </div>
  
<script>
document.addEventListener("DOMContentLoaded", function () {

  const stories = [
    {
      title: "The Creation",
      verse: "Genesis 1",
      text: "In the beginning, God created the heavens and the earth."
    },
    {
      title: "David and Goliath",
      verse: "1 Samuel 17",
      text: "David trusted God and defeated the giant Goliath."
    },
    {
      title: "The Good Shepherd",
      verse: "John 10:11",
      text: "Jesus said, 'I am the good shepherd.'"
    }
  ];

  const today = new Date().getDate();
  const index = today % stories.length;
  const story = stories[index];

  const container = document.getElementById("storyContainer");

  if (container) {
    container.innerHTML = `
      <h2>${story.title}</h2>
      <p><em>${story.verse}</em></p>
      <p>${story.text}</p>
    `;
  }

});
</script>
</div>

<footer>
  <p>© 2026 Selah | Be Still and Know</p>
</footer>

</body>
</html>
