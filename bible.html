<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selah — Holy Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SELAH</h1>
  <p class="tagline">Holy Bible</p>
  <a href="index.html" class="home-link">Home</a>
</header>

<main class="bible-container">

  <h2>Search Scripture</h2>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Example: John 3:16">
    <button onclick="searchVerse()">Search</button>
  </div>

  <h2>Select a Book</h2>

  <div class="book-list" id="bookList"></div>

  <div class="chapter-box">
    <h3 id="chapterTitle"></h3>
    <p id="chapterContent">Select a book or search a verse.</p>
  </div>

</main>

<script src="bible.js"></script>
</body>
</html>
