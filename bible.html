<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selah — Holy Bible</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

  <h1 class="fade-in">SELAH</h1>
  <p class="tagline">Pause • Pray • Reflect</p>
  <button id="themeToggle">🌙</button>

</header>

<main class="bible-container">

  <h2>Search Scripture</h2>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Example: John 3:16">
    <button onclick="searchVerse()">Search</button>
  </div>

  <h2>Select Book & Chapter</h2>

  <div class="selector-box">
    <select id="bookSelect"></select>
    <input type="number" id="chapterNumber" min="1" value="1">
    <button onclick="loadSelected()">Load</button>
  </div>

  <div class="chapter-box">
    <h3 id="chapterTitle"></h3>
    <div id="chapterContent">Select a book and chapter.</div>
  </div>

  <h2>❤️ Saved Verses</h2>
  <div id="favorites"></div>

  <h2>✍ Devotionals (Admin)</h2>
  <div class="admin-box">
    <textarea id="devotionalInput" placeholder="Write devotional..."></textarea>
    <button onclick="saveDevotional()">Save Devotional</button>
  </div>
  <div id="devotionalList"></div>

</main>

<script src="bible.js"></script>
</body>
</html>
